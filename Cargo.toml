[package]
name = "ordes"
version = "0.1.0"
edition = "2021"
authors = ["ActualSynergy"]
description = "Orbital Design Suite - Comprehensive platform for designing, simulating, and testing satellites and spacecraft"
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
actix-web = "4.4"
actix-rt = "2.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
async-trait = "0.1"

[[lib]]
name = "ordes"
path = "src/lib.rs"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
